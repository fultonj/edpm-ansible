- name: Apply ovsdb configuration from configMaps
  block:
    - name: Check that config file exists
      ansible.builtin.stat:
        path: "{{ edpm_ovn_config_src }}/ovsdb-config"
      register: ovsdb_config_exists
      delegate_to: localhost
      become: false

    - name: Gather ansible_machine_id fact if needed
      when:
        - ansible_machine_id is undefined
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - "machine"

    - name: Load ovsdb configuration from file
      ansible.builtin.include_vars:
        file: "{{ edpm_ovn_config_src }}/ovsdb-config"
        name: edpm_ovn_configmap_facts
      when:
        ovsdb_config_exists.stat.exists
      delegate_to: localhost
      become: false

    - name: Append ovsdb configMap options to external_ids
      ansible.builtin.set_fact:
        edpm_ovn_ovs_external_ids: "{{ edpm_ovn_ovs_external_ids | combine(edpm_ovn_configmap_facts | default({})) }}"

- name: Configure OVN CMS Options
  block:
    - name: Configure GW ports on chassis setting when enabled
      ansible.builtin.set_fact:
        chassis_options:
          - "enable-chassis-as-gw"
      when: edpm_enable_chassis_gw | default(false)

    - name: Configure external port hosting on chassis setting when enabled
      ansible.builtin.set_fact:
        chassis_options: "{{ chassis_options | default([]) + ['enable-chassis-as-extport-host'] }}"
      when: edpm_enable_chassis_extport | default(false)

    - name: Configure availability zones for chassis if set
      ansible.builtin.set_fact:
        chassis_options: "{{ chassis_options | default([]) + ['availability-zones=' + edpm_ovn_availability_zones | join(':')] }}"
      when: edpm_ovn_availability_zones | length > 0

    - name: Configure resource provider bandwidths if set
      ansible.builtin.set_fact:
        chassis_options: >-
          {%- set bandwidth_entries = [] -%}
          {%- for provider, bandwidth in edpm_ovn_resource_provider_bandwidths.items() -%}
            {%- set egress_val = bandwidth.egress | default('') | string -%}
            {%- set ingress_val = bandwidth.ingress | default('') | string -%}
            {%- set _ = bandwidth_entries.append(provider + ':' + egress_val + ':' + ingress_val) -%}
          {%- endfor -%}
          {{ chassis_options | default([]) + ['resource_provider_bandwidths=' + bandwidth_entries|join(';')] }}
      when: edpm_ovn_resource_provider_bandwidths | length > 0

    - name: Configure resource provider hypervisors if set
      ansible.builtin.set_fact:
        chassis_options: >-
          {%- set hypervisor_entries = [] -%}
          {%- set all_providers = [] -%}
          {%- if edpm_ovn_resource_provider_hypervisors | length > 0 -%}
            {%- for provider, hypervisor in edpm_ovn_resource_provider_hypervisors.items() -%}
              {%- set _ = hypervisor_entries.append(provider + ':' + hypervisor) -%}
              {%- set _ = all_providers.append(provider) -%}
            {%- endfor -%}
          {%- endif -%}
          {%- for provider in edpm_ovn_resource_provider_bandwidths.keys() -%}
            {%- if provider not in all_providers -%}
              {%- set _ = hypervisor_entries.append(provider + ':' + ansible_facts['fqdn']) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ chassis_options | default([]) + ['resource_provider_hypervisors=' + hypervisor_entries|join(';')] }}
      when: >
        edpm_ovn_resource_provider_hypervisors | length > 0 or
        edpm_ovn_resource_provider_bandwidths | length > 0

    - name: Configure resource provider inventory defaults if set
      ansible.builtin.set_fact:
        chassis_options: >-
          {%- set inventory_entries = [] -%}
          {%- for option, value in edpm_ovn_resource_provider_inventory_defaults.items() -%}
            {%- set _ = inventory_entries.append(option + ':' + value|string) -%}
          {%- endfor -%}
          {{ chassis_options | default([]) + ['resource_provider_inventory_defaults=' + inventory_entries|join(';')] }}
      when: edpm_ovn_resource_provider_inventory_defaults | length > 0

    - name: Build OVN CMS Options
      ansible.builtin.set_fact:
        ovn_cms_options:
          ovn-cms-options: "{{ chassis_options | join(',') }}"
      when:
        - chassis_options is defined

    - name: Append OVN CMS Options to external_ids
      ansible.builtin.set_fact:
        edpm_ovn_ovs_external_ids: "{{ edpm_ovn_ovs_external_ids | combine(ovn_cms_options | default({})) }}"
      when:
        - ovn_cms_options is defined

- name: Configure hw-offload when required
  when: edpm_enable_hw_offload | default(false)
  block:
    - name: Add hw-offload if enabled
      ansible.builtin.set_fact:
        hw_offload:
          hw-offload: true

    - name: Append other_config with hw-offload
      ansible.builtin.set_fact:
        edpm_ovn_ovs_other_config: "{{ edpm_ovn_ovs_other_config | combine(hw_offload) }}"

- name: Check and configure OVS external_ids
  when: edpm_ovn_ovs_external_ids | length > 0
  block:
    - name: Assert ovn-encap-ip value is correct
      ansible.builtin.assert:
        that:
          - "'ovn-encap-ip' in edpm_ovn_ovs_external_ids"
          - edpm_ovn_ovs_external_ids['ovn-encap-ip'] | length > 0
        success_msg: "ovn-encap-ip is set to a valid value: {{ edpm_ovn_ovs_external_ids['ovn-encap-ip'] }}"
        fail_msg: "ovn-encap-ip must be defined and cannot be an empty string"

    # Read and compare before writing: the values are owned by different
    # components (e.g. neutron-ovn-agent appends to ovn-bridge-mappings and
    # edpm_ovn_chassis_mac_mappings is a generated value), so an unconditional
    # write both reports changed on every converge and rewrites a value that
    # OVS consumers act on.
    - name: Read current OVS external_ids
      become: true
      ansible.builtin.command:
        cmd: ovs-vsctl --columns=external_ids --format=json list Open_vSwitch
      register: ovs_external_ids_current
      changed_when: false

    - name: Parse current OVS external_ids
      ansible.builtin.set_fact:
        ovs_external_ids_current_map: "{{ dict((ovs_external_ids_current.stdout | from_json).data[0][0][1]) }}"

    - name: Initialize the set of OVS external_ids to change
      ansible.builtin.set_fact:
        ovs_external_ids_changed: {}

    - name: Compute OVS external_ids that differ from the current values
      ansible.builtin.set_fact:
        ovs_external_ids_changed: "{{ ovs_external_ids_changed | combine({item.key: item.value}) }}"
      loop: "{{ edpm_ovn_ovs_external_ids | dict2items }}"
      when: >-
        (item.key not in ovs_external_ids_current_map) or
        (ovs_external_ids_current_map[item.key] != (item.value | trim('"')))

    - name: Configure OVS external_ids
      become: true
      ansible.builtin.shell: >
        ovs-vsctl set open . {% for key, value in ovs_external_ids_changed.items() -%} external_ids:{{ key }}="{{ value }}" {% endfor %}
      register: ovs_external_ids
      changed_when: ovs_external_ids.rc == 0
      failed_when: ovs_external_ids.rc != 0
      when: ovs_external_ids_changed | length > 0

- name: Configure OVS other_config
  become: true
  block:
    - name: Read current OVS other_config
      ansible.builtin.command:
        cmd: ovs-vsctl --columns=other_config --format=json list Open_vSwitch
      register: ovs_other_config_current
      changed_when: false

    - name: Parse current OVS other_config
      ansible.builtin.set_fact:
        ovs_other_config_current_map: "{{ dict((ovs_other_config_current.stdout | from_json).data[0][0][1]) }}"

    - name: Initialize the set of OVS other_config values to change
      ansible.builtin.set_fact:
        ovs_other_config_changed: {}

    - name: Compute OVS other_config that differs from the current values
      ansible.builtin.set_fact:
        ovs_other_config_changed: "{{ ovs_other_config_changed | combine({item.key: item.value}) }}"
      loop: "{{ edpm_ovn_ovs_other_config | dict2items }}"
      when: >-
        (item.key not in ovs_other_config_current_map) or
        (ovs_other_config_current_map[item.key] != (item.value | string))

    - name: Configure OVS other_config
      ansible.builtin.shell: >
        ovs-vsctl set open . {% for key, value in ovs_other_config_changed.items() %} other_config:{{ key }}={{ value }} {% endfor %}
      register: ovs_other_config
      changed_when: ovs_other_config.rc == 0
      failed_when: ovs_other_config.rc != 0
      when: ovs_other_config_changed | length > 0
  when: edpm_ovn_ovs_other_config | length > 0

- name: Add OVS Manager
  become: true
  block:
    - name: Check if OVS Manager already exists
      ansible.builtin.shell: |
        set -o pipefail
        ovs-vsctl show | grep -q "Manager"
      register: ovs_manager_configured
      changed_when: false
      failed_when: false

    - name: Add OVS Manager if not exists
      ansible.builtin.shell: >
        ovs-vsctl --timeout=5 --id=@manager -- create Manager target=\"ptcp:6640:127.0.0.1\" -- add Open_vSwitch . manager_options @manager
      when: ovs_manager_configured.rc == 1
      register: ovs_manager_if_not_exists
      changed_when: ovs_manager_if_not_exists.rc == 0
      failed_when: ovs_manager_if_not_exists.rc != 0
