- name: Ensure Openvswitch installed and running
  ansible.builtin.include_role:
    name: osp.edpm.edpm_ovs
    tasks_from: "install.yml"

- name: Configure OVS external_ids
  become: true
  when: edpm_ovn_bgp_agent_local_ovn_ovs_external_ids | length > 0
  block:
    # Read and compare before writing so a converge with unchanged
    # configuration does not rewrite the OVSDB column.
    - name: Read current OVS external_ids
      ansible.builtin.command:
        cmd: ovs-vsctl --columns=external_ids --format=json list Open_vSwitch
      register: ovn_ovs_external_ids_current
      changed_when: false

    - name: Parse current OVS external_ids
      ansible.builtin.set_fact:
        ovn_ovs_external_ids_current_map: "{{ dict((ovn_ovs_external_ids_current.stdout | from_json).data[0][0][1]) }}"

    - name: Initialize the set of OVS external_ids to change
      ansible.builtin.set_fact:
        ovn_ovs_external_ids_changed: {}

    - name: Compute OVS external_ids that differ from the current values
      ansible.builtin.set_fact:
        ovn_ovs_external_ids_changed: "{{ ovn_ovs_external_ids_changed | combine({item.key: item.value}) }}"
      loop: "{{ edpm_ovn_bgp_agent_local_ovn_ovs_external_ids | dict2items }}"
      when: >-
        (item.key not in ovn_ovs_external_ids_current_map) or
        (ovn_ovs_external_ids_current_map[item.key] != (item.value | string))

    - name: Configure OVS external_ids
      ansible.builtin.shell: >
        ovs-vsctl set open . {% for key, value in ovn_ovs_external_ids_changed.items() %} external_ids:{{ key }}={{ value }} {% endfor %}
      register: ovn_ovs_external_ids
      changed_when: ovn_ovs_external_ids.rc == 0
      failed_when: ovn_ovs_external_ids.rc != 0
      when: ovn_ovs_external_ids_changed | length > 0
